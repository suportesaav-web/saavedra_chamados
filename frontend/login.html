<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login | Saavedra Chamados</title>
    <style>
        :root {
            --saavedra-black: #25282a;
            --saavedra-orange: #dc4405;
            --saavedra-red: #da291c;
        }
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--saavedra-black); margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 320px; border-top: 5px solid var(--saavedra-orange); }
        .login-card h2 { margin: 0 0 10px 0; font-size: 26px; text-align: center; font-weight: normal;}
        .login-card h2 span { color: var(--saavedra-orange); font-weight: bold; }
        .login-card p { color: #666; font-size: 13px; text-align: center; margin-bottom: 25px; }
        
        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .form-group label { font-size: 12px; font-weight: bold; color: #444; margin-bottom: 5px; }
        .form-group input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
        .form-group input:focus { border-color: var(--saavedra-orange); }
        
        .btn-submit { background: var(--saavedra-orange); color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 10px; }
        .btn-submit:hover { background: #b83804; }
        .error-msg { color: var(--saavedra-red); font-size: 13px; margin-top: 10px; text-align: center; display: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Saavedra <span>Chamados</span></h2>
        <p>Painel Interno de Autenticação</p>
        
        <form id="formLogin">
            <div class="form-group">
                <label>E-mail Corporativo</label>
                <input type="email" id="txtEmail" required placeholder="usuario@saavedra.com.br" autocomplete="username">
            </div>
            <div class="form-group">
                <label>Senha de Acesso</label>
                <input type="password" id="txtSenha" required placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" class="btn-submit">Entrar no Sistema</button>
            <div id="errorMsg" class="error-msg">E-mail ou senha incorretos.</div>
        </form>
    </div>

    <script>
        const API_URL = 'http://10.0.0.252:8082/api';

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('txtEmail').value;
            const senha = document.getElementById('txtSenha').value;
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha }),
                    credentials: 'include' // Envia e armazena o cookie gerado pelo backend
                });

                if (res.ok) {
                    // Login efetuado com sucesso! Redireciona para o index local
                    window.location.href = 'index.html';
                } else {
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                alert("Erro ao conectar com o servidor local.");
            }
        });
    </script>
</body>
</html>
