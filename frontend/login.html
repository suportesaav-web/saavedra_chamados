<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Saavedra Chamados</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        /* Estilos exclusivos da tela de Login */
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--saavedra-black); margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: var(--border-radius); box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 340px; border-top: 5px solid var(--saavedra-orange); }
        .login-card h2 { margin: 0 0 10px 0; font-size: 26px; text-align: center; font-weight: normal; display: flex; align-items: center; justify-content: center; gap: 8px;}
        .login-card h2 span { color: var(--saavedra-orange); font-weight: bold; }
        .login-card p { color: #6b7280; font-size: 14px; text-align: center; margin-bottom: 25px; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 18px; }
        .form-group label { font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; display: flex; align-items: center; gap: 5px;}
        .btn-submit { width: 100%; justify-content: center; padding: 12px; font-size: 15px; margin-top: 10px; }
        .error-msg { color: var(--saavedra-red); font-size: 13px; margin-top: 15px; text-align: center; display: none; font-weight: bold; background: #fce8e6; padding: 10px; border-radius: 6px; border: 1px solid #fad2cf;}
    </style>
</head>
<body>
    <main class="login-card">
        <h2><span class="material-symbols-outlined" style="font-size: 32px;">support_agent</span> Saavedra <span>Chamados</span></h2>
        <p>Painel Interno de Autenticação</p>
        
        <form id="formLogin">
            <div class="form-group">
                <label><span class="material-symbols-outlined" style="font-size: 18px;">mail</span> E-mail Corporativo</label>
                <input type="email" id="txtEmail" class="form-input" required placeholder="usuario@saavedra.com.br" autocomplete="username">
            </div>
            <div class="form-group">
                <label><span class="material-symbols-outlined" style="font-size: 18px;">lock</span> Senha de Acesso</label>
                <input type="password" id="txtSenha" class="form-input" required placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-solid btn-submit">
                <span class="material-symbols-outlined">login</span> Entrar no Sistema
            </button>
            <div id="errorMsg" class="error-msg">
                <span class="material-symbols-outlined" style="font-size: 16px; vertical-align: middle;">error</span> E-mail ou senha incorretos.
            </div>
        </form>
    </main>

    <script>
        const API_URL = 'http://10.0.0.252:8082/api';

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('txtEmail').value;
            const senha = document.getElementById('txtSenha').value;
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha }),
                    credentials: 'include'
                });

                if (res.ok) {
                    window.location.href = 'index.html';
                } else {
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                alert("Erro ao conectar com o servidor local.");
            }
        });
    </script>
</body>
</html>
