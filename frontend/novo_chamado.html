<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Chamado | Saavedra</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <script src="auth.js"></script>
    <script src="js/anexos.js"></script>
    <style>
        .form-container-card { max-width: 800px; margin: 40px auto; padding: 35px; background: white; border-radius: var(--border-radius); box-shadow: var(--card-shadow); border-top: 5px solid var(--saavedra-orange); }
        .form-container-card h2 { margin-top: 0; border-bottom: 1px solid #f3f4f6; padding-bottom: 15px; margin-bottom: 25px; display: flex; align-items: center; gap: 8px;}
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; }
        .form-group label { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #374151; display: flex; align-items: center; gap: 6px; }
        .form-group textarea { resize: vertical; min-height: 120px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .alert { padding: 15px; border-radius: 6px; margin-bottom: 20px; font-weight: bold; display: none; display: flex; align-items: center; gap: 10px; }
        .alert-success { background: #def7ec; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #fce8e6; color: #721c24; border: 1px solid #f5c6cb; }
        .btn-submit { width: 100%; justify-content: center; padding: 14px; font-size: 16px; margin-top: 15px; }
        .btn-submit:disabled { background: #9ca3af; cursor: not-allowed; border-color: transparent; }
        .anexo-chip { background: #e5e7eb; padding: 6px 12px; border-radius: 16px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; color: #374151; font-weight: 500; }
        .anexo-chip-remover { cursor: pointer; color: #dc2626; font-weight: bold; border: none; background: none; padding: 0; display: flex; align-items: center; }
    </style>
</head>
<body>

    <header class="navbar">
        <h1 class="navbar-brand">
            <span class="material-symbols-outlined" style="font-size: 30px;">support_agent</span>
            Saavedra <span>Chamados</span>
        </h1>
        <nav class="nav-actions">
            <a href="index.html" class="btn btn-outline">
                <span class="material-symbols-outlined">arrow_back</span> Voltar ao Início
            </a>
            <button onclick="fazerLogout()" class="btn btn-danger">
                <span class="material-symbols-outlined">logout</span> Sair
            </button>
        </nav>
    </header>

    <main class="form-container-card">
        <h2><span class="material-symbols-outlined">add_task</span> Abrir Novo Chamado</h2>
        
        <div id="alertSuccess" class="alert alert-success" style="display: none;">
            <span class="material-symbols-outlined">check_circle</span> Chamado aberto com sucesso! Redirecionando...
        </div>
        <div id="alertError" class="alert alert-error" style="display: none;">
            <span class="material-symbols-outlined">error</span> Ocorreu um erro ao abrir o chamado. Tente novamente.
        </div>

        <form id="formNovoChamado">
            <div class="form-group">
                <label for="titulo"><span class="material-symbols-outlined" style="font-size: 18px;">title</span> Título / Resumo do Problema *</label>
                <input type="text" id="titulo" class="form-input" required placeholder="Ex: Erro ao acessar o sistema ERP">
            </div>

            <div class="form-group">
                <label><span class="material-symbols-outlined" style="font-size: 18px;">description</span> Descrição Detalhada *</label>
                <div id="descricao-container" style="height: 200px; background: white; font-family: inherit;"></div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="solicitante_id"><span class="material-symbols-outlined" style="font-size: 18px;">person</span> Solicitante *</label>
                    <select id="solicitante_id" class="form-input" required>
                        <option value="">Carregando...</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="tecnico_id"><span class="material-symbols-outlined" style="font-size: 18px;">engineering</span> Atribuir Técnico (Opcional)</label>
                    <select id="tecnico_id" class="form-input">
                        <option value="">Deixar na fila de triagem</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="tipo_id"><span class="material-symbols-outlined" style="font-size: 18px;">category</span> Tipo *</label>
                    <select id="tipo_id" class="form-input" required></select>
                </div>
                
                <div class="form-group">
                    <label for="prioridade_id"><span class="material-symbols-outlined" style="font-size: 18px;">priority_high</span> Prioridade *</label>
                    <select id="prioridade_id" class="form-input" required></select>
                </div>
            </div>

            <div class="form-group" style="margin-top: 10px; background: #f3f4f6; padding: 15px; border-radius: 6px; border: 1px dashed #d1d5db;">
                <label for="anexo"><span class="material-symbols-outlined" style="font-size: 18px;">attachment</span> Anexar Arquivos, Imagens ou PDFs (Cole imagens com CTRL+V)</label>
                <input type="file" id="anexo" multiple style="font-size: 13px; margin-top: 5px;">
                <div id="listaAnexosUI" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;"></div>
            </div>

            <button type="submit" class="btn btn-solid btn-submit" id="btnSalvar">
                <span class="material-symbols-outlined">send</span> Abrir Chamado
            </button>
        </form>
    </main>

    <script>
        async function carregarOpcoes(endpoint, selectId) {
            try {
                const res = await fetch(`${API_BASE_URL}/${endpoint}`, { credentials: 'include' });
                const data = await res.json();
                const select = document.getElementById(selectId);
                select.innerHTML = selectId === 'solicitante_id' ? '<option value="">Selecione...</option>' : (selectId === 'tecnico_id' ? '<option value="">Deixar na fila de triagem</option>' : '');
                data.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.id; 
                    option.textContent = item.nome;
                    select.appendChild(option);
                });

                // 🌟 DEFINIÇÃO DA PRIORIDADE PADRÃO "Sem Prioridade" (ID 1)
                if (selectId === 'prioridade_id' && document.getElementById('prioridade_id').options.length > 0) {
                    document.getElementById('prioridade_id').value = 1;
                }

            } catch (e) { console.error(e); }
        }

        let quillDescricao;

        window.addEventListener('DOMContentLoaded', async () => {
            quillDescricao = new Quill('#descricao-container', {
                theme: 'snow',
                placeholder: 'Descreva com detalhes a sua necessidade ou problema...',
                modules: { toolbar: [ ['bold', 'italic', 'underline'], [{'list': 'ordered'}, {'list': 'bullet'}], ['code-block'], ['clean'] ] }
            });

            await Promise.all([
                carregarOpcoes('usuarios', 'solicitante_id'),
                carregarOpcoes('usuarios/tecnicos', 'tecnico_id'),
                carregarOpcoes('cadastros/tipo', 'tipo_id'),
                carregarOpcoes('cadastros/prioridade', 'prioridade_id')
            ]);
            setTimeout(() => {
                if (window.usuarioLogado && window.usuarioLogado.id) {
                    document.getElementById('solicitante_id').value = window.usuarioLogado.id;
                    if (window.usuarioLogado.perfil === 'Comum') {
                        document.getElementById('solicitante_id').disabled = true;
                    }
                }
            }, 500);

            inicializarGerenciadorAnexos('anexo');
        });

        document.getElementById('formNovoChamado').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const conteudoHTML = quillDescricao.root.innerHTML;
            if (quillDescricao.getText().trim().length === 0) {
                alert("Por favor, preencha a descrição do chamado.");
                return;
            }

            const btnSalvar = document.getElementById('btnSalvar');
            btnSalvar.disabled = true; 
            btnSalvar.innerHTML = `<span class="material-symbols-outlined">sync</span> Processando...`;

            const solicitanteId = parseInt(document.getElementById('solicitante_id').value);
            const payload = {
                titulo: document.getElementById('titulo').value,
                descricao: conteudoHTML,
                solicitante_id: solicitanteId,
                tipo_id: parseInt(document.getElementById('tipo_id').value),
                prioridade_id: parseInt(document.getElementById('prioridade_id').value) || 1,
                status_id: 1,
                tecnico_id: document.getElementById('tecnico_id').value ? parseInt(document.getElementById('tecnico_id').value) : null
            };

            try {
                const res = await fetch(`${API_BASE_URL}/tarefas`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    credentials: 'include'
                });

                if (res.ok) {
                    const ticketData = await res.json();
                    const ticketId = ticketData.id;
                    const fileInput = document.getElementById('anexo');
                    
                    if (arquivosAnexados.files.length > 0) {
                        const formData = new FormData();
                        for (let i = 0; i < arquivosAnexados.files.length; i++) {
                            formData.append('files', arquivosAnexados.files[i]);
                        }
                        await fetch(`${API_BASE_URL}/tarefas/${ticketId}/anexar`, { 
                            method: 'POST', body: formData, credentials: 'include' 
                        });
                    }

                    document.getElementById('alertSuccess').style.display = 'flex';
                    setTimeout(() => { window.location.href = `index.html?criado=${ticketId}`; }, 1000);
                } else { throw new Error(); }
            } catch (error) {
                document.getElementById('alertError').style.display = 'flex';
                btnSalvar.disabled = false; 
                btnSalvar.innerHTML = `<span class="material-symbols-outlined">send</span> Abrir Chamado`;
            }
        });
    </script>
</body>
</html>
